name: Deploy Mudavi API to Cloudflare

on:
  push:
    branches: [staging, main]
    paths:
      - movaro/apps/api/**
      - movaro/packages/contracts/**
      - movaro/scripts/audit-*.mjs
      - .github/workflows/deploy-cloudflare-api.yml
  workflow_dispatch:

concurrency:
  group: mudavi-api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.DEPLOY_ENABLED == 'true' && vars.CLOUDFLARE_CONTAINER_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: movaro/apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: movaro/apps/api/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run cloudflare:check
      - name: Deploy Worker and API container
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: movaro/apps/api
          command: deploy --config wrangler.container.jsonc ${{ github.ref_name == 'staging' && '--env staging' || '' }} --containers-rollout=immediate
