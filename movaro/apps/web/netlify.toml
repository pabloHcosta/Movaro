# Static deploy for the Movaro SEO city pages.
# There is NO build step — the HTML is pre-generated. Regenerate with:
#   cd apps/api && npm run generate:city-pages
#
# On Netlify: set the site "base directory" to `apps/web` and this file makes
# `public/` the publish directory.
[build]
  publish = "public"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
