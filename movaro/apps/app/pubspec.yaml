name: movaro_app
description: "Movaro Flutter application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.2.2
  http: ^1.6.0
  flutter_svg: ^2.2.0
  cached_network_image: ^3.4.1
  latlong2: ^0.10.1
  intl: ^0.20.2
  path_provider: ^2.1.5
  geolocator: ^14.0.2
  geocoding: ^5.0.0
  shared_preferences: ^2.5.3
  supabase_flutter: ^2.12.0
  add_2_calendar_new:
    path: packages/add_2_calendar_new
  url_launcher: ^6.3.2
  webview_flutter: ^4.13.0
  photo_view: ^0.15.0
  share_plus: ^13.3.0
  flutter_local_notifications: ^22.2.0
  timezone: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  config:
    enable-lldb-debugging: false
    enable-swift-package-manager: false
  generate: true
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/illustrations/
    - assets/seed/
    - assets/seed/snapshots/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/movaro_app_icon.png
  adaptive_icon_background: "#071A35"
  adaptive_icon_foreground: assets/brand/movaro_app_icon_foreground.png
  adaptive_icon_monochrome: assets/brand/movaro_app_icon_monochrome.png
  adaptive_icon_foreground_inset: 0
  image_path_ios_dark_transparent: assets/brand/movaro_app_icon_ios_dark.png
  image_path_ios_tinted_grayscale: assets/brand/movaro_app_icon_ios_tinted.png
  desaturate_tinted_to_grayscale_ios: true
  remove_alpha_ios: true
  macos:
    generate: true
    image_path: assets/brand/movaro_app_icon_macos.png
  web:
    generate: true
    image_path: assets/brand/movaro_app_icon.png
    background_color: "#050B15"
    theme_color: "#071A35"
  windows:
    generate: true
    image_path: assets/brand/movaro_app_icon.png
    icon_size: 256
